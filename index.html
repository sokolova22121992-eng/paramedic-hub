<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PARAMEDIC HUB</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #F5F6F7;

            color: #20252A;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width: 760px;

            margin: 0 auto;

            padding:
                32px
                18px
                50px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            margin-bottom: 32px;
        }


        .logo {

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 2.5px;

            color: #167C78;

            margin-bottom: 4px;
        }


        h1 {

            margin: 0;

            font-size: 38px;

            line-height: 1;

            font-weight: 800;

            letter-spacing: -1.5px;
        }


        .subtitle {

            margin-top: 10px;

            font-size: 14px;

            color: #7A838B;
        }


        /* =========================
           SECTION
        ========================= */

        .section-title {

            margin-bottom: 12px;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 1px;

            text-transform: uppercase;

            color: #7A838B;
        }


        /* =========================
           GROUP LIST
        ========================= */

        .groups {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        /* =========================
           GROUP CARD
        ========================= */

        .group {

            display: flex;

            align-items: center;

            width: 100%;

            padding: 6px 10px;

            background: #FFFFFF;

            border: 1px solid #E7EAEC;

            border-radius: 12px;

            color: #20252A;

            box-shadow:
                0 2px 6px
                rgba(0, 0, 0, 0.035);

            user-select: none;

            touch-action: pan-y;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease,
                border-color 0.15s ease;
        }


        .group.dragging {

            opacity: 0.45;

            transform: scale(1.02);
        }


        .group.drag-over {

            border-top:
                3px solid
                #167C78;
        }


        /* =========================
           GROUP MAIN
        ========================= */

        .group-main {

            display: flex;

            align-items: center;

            gap: 9px;

            flex: 1;

            min-width: 0;

            text-decoration: none;

            color: inherit;
        }


        /* =========================
           ICON
        ========================= */

        .group-icon {

            width: 32px;

            height: 32px;

            min-width: 32px;

            border-radius: 8px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #E8F4F3;

            font-size: 16px;
        }


        /* =========================
           TEXT
        ========================= */

        .group-info {

            flex: 1;

            min-width: 0;
        }


        .name {

            font-size: 15px;

            font-weight: 750;

            line-height: 1.1;

            margin-bottom: 1px;
        }


        .description {

            font-size: 12px;

            color: #7A838B;

            line-height: 1.15;
        }


        /* =========================
           ARROW
        ========================= */

        .arrow {

            font-size: 19px;

            color: #A1A8AD;

            line-height: 1;
        }


        /* =========================
           ADMIN ACTIONS
        ========================= */

        .group-actions {

            display: flex;

            align-items: center;

            gap: 4px;

            margin-left: 5px;
        }


        .group-actions button {

            width: 28px;

            height: 28px;

            padding: 0;

            border:
                1px solid
                #E1E5E7;

            border-radius: 7px;

            background: #FFFFFF;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;
        }


        .group-actions button:hover {

            background: #F3F5F6;
        }


        .edit-btn {

            color: #167C78;
        }


        .delete-btn {

            color: #B44A4A;
        }


        /* =========================
           ADD BUTTON
        ========================= */

        .add-button-wrapper {

            display: flex;

            justify-content: center;

            margin-top: 20px;
        }


        .add {

            height: 50px;

            padding:
                0 26px;

            border: none;

            border-radius: 13px;

            background: #167C78;

            color: #FFFFFF;

            font-size: 15px;

            font-weight: 700;

            font-family: inherit;

            cursor: pointer;

            box-shadow:
                0 4px 12px
                rgba(22, 124, 120, 0.20);

            transition:
                background 0.15s ease,
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }


        .add:hover {

            background: #126A67;

            transform: translateY(-1px);

            box-shadow:
                0 6px 16px
                rgba(22, 124, 120, 0.24);
        }


        .add:active {

            transform: translateY(0);
        }


        /* =========================
           MODAL BACKGROUND
        ========================= */

        .overlay {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 100;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(20, 25, 28, 0.48);
        }


        /* =========================
           MODAL
        ========================= */

        .modal {

            width: 100%;

            max-width: 470px;

            padding: 24px;

            background: #FFFFFF;

            border-radius: 20px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.18);
        }


        .modal h2 {

            margin:
                0
                0
                7px;

            font-size: 22px;

            line-height: 1.2;
        }


        .modal-description {

            margin:
                0
                0
                20px;

            font-size: 13px;

            line-height: 1.45;

            color: #7A838B;
        }


        /* =========================
           FORM
        ========================= */

        label {

            display: block;

            margin-bottom: 6px;

            font-size: 13px;

            font-weight: 700;

            color: #4F585E;
        }


        input {

            width: 100%;

            height: 46px;

            margin-bottom: 15px;

            padding:
                0
                13px;

            border:
                1px solid
                #D9DEE0;

            border-radius: 11px;

            background: #FFFFFF;

            color: #20252A;

            font-family: inherit;

            font-size: 14px;

            outline: none;
        }


        input:focus {

            border-color: #167C78;

            box-shadow:
                0 0 0 3px
                rgba(22, 124, 120, 0.08);
        }


        /* =========================
           MODAL BUTTONS
        ========================= */

        .modal-buttons {

            display: flex;

            gap: 10px;

            margin-top: 5px;
        }


        .cancel,
        .save {

            flex: 1;

            height: 46px;

            border: none;

            border-radius: 11px;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;
        }


        .cancel {

            background: #EEF0F1;

            color: #596168;
        }


        .save {

            background: #167C78;

            color: #FFFFFF;
        }


        .save:hover {

            background: #126A67;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .container {

                padding:
                    26px
                    14px
                    40px;
            }


            h1 {

                font-size: 34px;
            }


            .group {

                padding: 15px;
            }


            .group-icon {

                width: 44px;

                height: 44px;

                min-width: 44px;
            }


            .modal {

                padding: 20px;
            }


            .add {

                width: auto;

                min-width: 190px;
            }

        }

    </style>

</head>


<body>


    <main class="container">


        <!-- HEADER -->

        <header class="header">

            <div class="logo">
                PARAMEDIC
            </div>

            <h1>
                HUB
            </h1>

            <div class="subtitle">

            </button>

    </main>



    <!-- =========================
         ADD / EDIT GROUP MODAL
    ========================= -->

    <div
        class="overlay"
        id="overlay"
        onclick="closeOutside(event)"
    >

        <div
            class="modal"

        >

            <h2 id="groupModalTitle">
                Додати групу
            </h2>


            <p class="modal-description">
                Додайте навчальну групу до PARAMEDIC HUB.
            </p>


            <!-- NAME -->

            <label for="groupName">
                Назва групи
            </label>

            <input
                id="groupName"
                type="text"
                placeholder="Наприклад: Група 12"
            >


            <!-- DESCRIPTION -->

            <label for="groupDescription">
                Опис
            </label>

            <input
                id="groupDescription"
                type="text"
                placeholder="Перепідготовка парамедиків"
            >


            <!-- TELEGRAM LINK -->

            <label for="groupLink">
                Посилання на Telegram-групу

            <input

                <button

                    onclick="closeForm()"

    <!-- =========================
         ADMIN LOGIN MODAL
    ========================= -->

    <div
        class="overlay"
        id="adminOverlay"
        onclick="closeAdminLogin(event)"
        style="display: none;"
    >

        <div
            class="modal"
            onclick="event.stopPropagation()"
        >

            <h2>
                Вхід адміністратора
            </h2>

                Пароль
            </label>

                type="password"

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        /* =========================
           SUPABASE
        ========================= */

        const SUPABASE_URL =
            "https://ccgsbwzdnagrjttuwdwo.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_x0hztESOV7ohYyqaFzks2g_7ee-N8xE";


        const db =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        let editingGroupId = null;



        /* =========================
           LOAD GROUPS
        ========================= */

        async function loadGroups() {

            const { data, error } = await db
                .from("groups")
                .select(
                    "id, name, description, telegram_link, sort_order"
                )
                .order(
                    "sort_order",
                    {
                        ascending: true
                    }
                );


            if (error) {

                console.error(error);

                return;
            }


            const groups =
                document.getElementById("groups");


            if (!groups) return;


            groups.innerHTML = "";


            data.forEach(group => {

                groups.innerHTML += `

                    <div
                        class="group"
                        data-id="${group.id}"
                    >

                        <a
                            href="${group.telegram_link}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="group-main"
                        >

                            <div class="group-icon">
                                👥
                            </div>


                            <div class="group-info">

                                <div class="name">

                                    ${escapeHTML(
                                        group.name
                                    )}

                                </div>


                                <div class="description">

                                    ${escapeHTML(
                                        group.description || ""
                                    )}

                                </div>

                            </div>


                            <div class="arrow">
                                ›
                            </div>

                        </a>


                        <div class="group-actions">

                            <!-- EDIT -->

                            <button
                                class="edit-btn"
                                onclick="
                                    editGroup(
                                        '${group.id}',
                                        event
                                    )
                                "
                            >

                                <svg
                                    width="17"
                                    height="17"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >

                                    <path d="M12 20h9"/>

                                    <path
                                        d="
                                            M16.5 3.5
                                            a2.1 2.1 0 0 1 3 3
                                            L7 19
                                            l-4 1
                                            1-4
                                            Z
                                        "
                                    />

                                </svg>

                            </button>


                            <!-- DELETE -->

                            <button
                                class="delete-btn"
                                onclick="
                                    deleteGroup(
                                        '${group.id}',
                                        event
                                    )
                                "
                            >

                                <svg
                                    width="17"
                                    height="17"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >

                                    <path d="M3 6h18"/>

                                    <path
                                        d="
                                            M8 6V4h8v2
                                        "
                                    />

                                    <path
                                        d="
                                            M19 6l-1 14H6L5 6
                                        "
                                    />

                                    <path d="M10 11v5"/>

                                    <path d="M14 11v5"/>

                                </svg>

                            </button>

                        </div>

                    </div>

                `;
            });


            enableDragAndDrop();

            updateAdminUI();
        }



        /* =========================
           DRAG & DROP
        ========================= */

        function enableDragAndDrop() {

            const container =
                document.getElementById("groups");


            if (!container) return;


            let dragged = null;

            let startY = 0;

            let draggingStarted = false;


            container
                .querySelectorAll(".group")
                .forEach(card => {


                    card.onpointerdown =
                        function(event) {


                            const isAdmin =
                                document.body.dataset.admin === "true";


                            if (!isAdmin) {
                                return;
                            }


                            if (
                                event.target.closest(
                                    ".group-actions"
                                )
                            ) {
                                return;
                            }


                            startY =
                                event.clientY;


                            draggingStarted =
                                false;


                            card.setPointerCapture(
                                event.pointerId
                            );


                            card.onpointermove =
                                function(moveEvent) {


                                    const distance =
                                        Math.abs(
                                            moveEvent.clientY -
                                            startY
                                        );


                                    if (
                                        !draggingStarted &&
                                        distance < 8
                                    ) {
                                        return;
                                    }


                                    draggingStarted =
                                        true;


                                    dragged =
                                        card;


                                    card.classList.add(
                                        "dragging"
                                    );


                                    const cards =
                                        [
                                            ...container.querySelectorAll(
                                                ".group:not(.dragging)"
                                            )
                                        ];


                                    const nextCard =
                                        cards.find(item => {

                                            const rect =
                                                item.getBoundingClientRect();


                                            return (
                                                moveEvent.clientY <
                                                rect.top +
                                                rect.height / 2
                                            );

                                        });


                                    container
                                        .querySelectorAll(
                                            ".group"
                                        )
                                        .forEach(item => {

                                            item.classList.remove(
                                                "drag-over"
                                            );

                                        });


                                    if (nextCard) {

                                        nextCard.classList.add(
                                            "drag-over"
                                        );


                                        container.insertBefore(
                                            card,
                                            nextCard
                                        );

                                    } else {

                                        container.appendChild(
                                            card
                                        );

                                    }

                                };


                            card.onpointerup =
                                async function() {


                                    card.releasePointerCapture(
                                        event.pointerId
                                    );


                                    card.onpointermove =
                                        null;


                                    card.onpointerup =
                                        null;


                                    if (
                                        !draggingStarted
                                    ) {
                                        return;
                                    }


                                    card.classList.remove(
                                        "dragging"
                                    );


                                    container
                                        .querySelectorAll(
                                            ".group"
                                        )
                                        .forEach(item => {

                                            item.classList.remove(
                                                "drag-over"
                                            );

                                        });


                                    await saveGroupOrder();

                                };

                        };

                });

        }



        /* =========================
           SAVE GROUP ORDER
        ========================= */

        async function saveGroupOrder() {

            const cards =
                [
                    ...document.querySelectorAll(
                        "#groups .group"
                    )
                ];


            for (
                let i = 0;
                i < cards.length;
                i++
            ) {

                const id =
                    cards[i].dataset.id;


                const { error } =
                    await db
                        .from("groups")
                        .update({
                            sort_order: i + 1
                        })
                        .eq("id", id);


                if (error) {

                    console.error(error);

                    alert(
                        "Не вдалося зберегти порядок груп."
                    );

                    return;
                }

            }

        }



        /* =========================
           SHOW ADD FORM
        ========================= */

        function showAddForm() {

            editingGroupId = null;


            document.getElementById(
                "groupModalTitle"
            ).textContent =
                "Додати групу";


            document.getElementById(
                "saveGroupButton"
            ).textContent =
                "Додати";


            document.getElementById(
                "groupName"
            ).value = "";


            document.getElementById(
                "groupDescription"
            ).value = "";


            document.getElementById(
                "groupLink"
            ).value = "";


            document.getElementById(
                "overlay"
            ).style.display =
                "flex";


            document.getElementById(
                "groupName"
            ).focus();

        }



        /* =========================
           CLOSE FORM
        ========================= */

        function closeForm() {

            document.getElementById(
                "overlay"
            ).style.display =
                "none";


            document.getElementById(
                "groupName"
            ).value = "";


            document.getElementById(
                "groupDescription"
            ).value = "";


            document.getElementById(
                "groupLink"
            ).value = "";


            editingGroupId = null;

        }



        function closeOutside(event) {

            if (
                event.target ===
                document.getElementById(
                    "overlay"
                )
            ) {

                closeForm();

            }

        }



        /* =========================
           SAVE GROUP
        ========================= */

        async function saveGroup() {

            const name =
                document.getElementById(
                    "groupName"
                ).value.trim();


            const description =
                document.getElementById(
                    "groupDescription"
                ).value.trim();


            const link =
                document.getElementById(
                    "groupLink"
                ).value.trim();


            if (!name) {

                alert(
                    "Вкажіть назву групи."
                );

                return;
            }


            if (!link) {

                alert(
                    "Вкажіть посилання на Telegram-групу."
                );

                return;
            }


            if (
                !link.startsWith(
                    "https://t.me/"
                )
            ) {

                alert(
                    "Посилання має починатися з https://t.me/"
                );

                return;
            }


            let error;


            if (editingGroupId) {


                const result =
                    await db
                        .from("groups")
                        .update({

                            name: name,

                            description:
                                description ||
                                "Навчальна група",

                            telegram_link:
                                link

                        })
                        .eq(
                            "id",
                            editingGroupId
                        );


                error =
                    result.error;


            } else {


                const { data: lastGroup } =
                    await db
                        .from("groups")
                        .select(
                            "sort_order"
                        )
                        .order(
                            "sort_order",
                            {
                                ascending: false
                            }
                        )
                        .limit(1);


                const nextOrder =
                    lastGroup &&
                    lastGroup.length
                        ? lastGroup[0].sort_order + 1
                        : 1;


                const result =
                    await db
                        .from("groups")
                        .insert({

                            name: name,

                            description:
                                description ||
                                "Навчальна група",

                            telegram_link:
                                link,

                            sort_order:
                                nextOrder

                        });


                error =
                    result.error;

            }


            if (error) {

                console.error(error);

                alert(
                    "Помилка: " +
                    error.message
                );

                return;
            }


            editingGroupId = null;


            closeForm();


            await loadGroups();

        }



        /* =========================
           EDIT GROUP
        ========================= */

        async function editGroup(
            id,
            event
        ) {

            event.preventDefault();

            event.stopPropagation();


            editingGroupId =
                id;


            const {
                data,
                error
            } =
                await db
                    .from("groups")
                    .select(
                        "id, name, description, telegram_link"
                    )
                    .eq(
                        "id",
                        id
                    )
                    .single();


            if (error) {

                console.error(error);

                alert(
                    "Помилка: " +
                    error.message
                );

                return;
            }


            document.getElementById(
                "groupModalTitle"
            ).textContent =
                "Редагувати групу";


            document.getElementById(
                "saveGroupButton"
            ).textContent =
                "Зберегти";


            document.getElementById(
                "groupName"
            ).value =
                data.name;


            document.getElementById(
                "groupDescription"
            ).value =
                data.description ||
                "";


            document.getElementById(
                "groupLink"
            ).value =
                data.telegram_link;


            document.getElementById(
                "overlay"
            ).style.display =
                "flex";

        }



        /* =========================
           DELETE GROUP
        ========================= */

        async function deleteGroup(
            id,
            event
        ) {

            event.preventDefault();

            event.stopPropagation();


            if (
                !confirm(
                    "Видалити цю групу з PARAMEDIC HUB?"
                )
            ) {

                return;
            }


            const { error } =
                await db
                    .from("groups")
                    .delete()
                    .eq(
                        "id",
                        id
                    );


            if (error) {

                console.error(error);

                alert(
                    "Помилка: " +
                    error.message
                );

                return;
            }


            await loadGroups();

        }



        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHTML(text) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;

        }



        /* =========================
           ADMIN LOGIN
        ========================= */

        async function adminLogin() {

            const email =
                document.getElementById(
                    "adminEmail"
                ).value.trim();


            const password =
                document.getElementById(
                    "adminPassword"
                ).value;


            if (
                !email ||
                !password
            ) {

                alert(
                    "Введіть email і пароль."
                );

                return;
            }


            const { error } =
                await db.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                alert(
                    "Неправильний email або пароль."
                );

                return;
            }


            closeAdminLogin();


            await updateAdminUI();


            await loadGroups();

        }



        /* =========================
           SHOW ADMIN LOGIN
        ========================= */

        function showAdminLogin() {

            document.getElementById(
                "adminOverlay"
            ).style.display =
                "flex";


            document.getElementById(
                "adminEmail"
            ).focus();

        }



        /* =========================
           CLOSE ADMIN LOGIN
        ========================= */

        function closeAdminLogin(event) {

            if (
                event &&
                event.target !==
                document.getElementById(
                    "adminOverlay"
                )
            ) {

                return;
            }


            document.getElementById(
                "adminOverlay"
            ).style.display =
                "none";


            document.getElementById(
                "adminEmail"
            ).value = "";


            document.getElementById(
                "adminPassword"
            ).value = "";

        }



        /* =========================
           ADMIN LOGOUT
        ========================= */

        async function adminLogout() {

            await db.auth.signOut();


            await updateAdminUI();


            await loadGroups();

        }



        /* =========================
           UPDATE ADMIN UI
        ========================= */

        async function updateAdminUI() {

            const { data } =
                await db.auth.getSession();


            const isAdmin =
                !!data.session;


            document.body.dataset.admin =
                isAdmin
                    ? "true"
                    : "false";


            const addButton =
                document.querySelector(
                    ".add-button-wrapper"
                );


            const groupActions =
                document.querySelectorAll(
                    ".group-actions"
                );


            const loginButton =
                document.querySelector(
                    'button[onclick="showAdminLogin()"]'
                );


            const logoutButton =
                document.getElementById(
                    "adminLogout"
                );


            if (addButton) {

                addButton.style.display =
                    isAdmin
                        ? "flex"
                        : "none";

            }


            groupActions.forEach(
                function(element) {

                    element.style.display =
                        isAdmin
                            ? "flex"
                            : "none";

                }
            );


            if (loginButton) {

                loginButton.style.display =
                    isAdmin
                        ? "none"
                        : "inline-block";

            }


            if (logoutButton) {

                logoutButton.style.display =
                    isAdmin
                        ? "block"
                        : "none";

            }

        }



        /* =========================
           AUTH STATE
        ========================= */

        db.auth.onAuthStateChange(
            function() {

                updateAdminUI();

            }
        );



        /* =========================
           START
        ========================= */

        loadGroups();

    </script>


</body>
