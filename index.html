<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PARAMEDIC HUB</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            background: #F5F6F7;
            color: #20252A;
        }

        .container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 18px 50px;
        }

        .header {
            margin-bottom: 32px;
        }

        .logo {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2.5px;
            color: #167C78;
            margin-bottom: 4px;
        }

        h1 {
            margin: 0;
            font-size: 38px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .subtitle {
            margin-top: 10px;
            font-size: 14px;
            color: #7A838B;
        }

        .section-title {
            margin-bottom: 12px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #7A838B;
        }

        .error {
            display: none;
            margin-bottom: 15px;
            padding: 14px;
            border-radius: 12px;
            background: #FDECEC;
            border: 1px solid #F2C7C7;
            color: #9B3D3D;
            font-size: 13px;
            line-height: 1.4;
        }

        .groups {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .group {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            padding: 6px 10px;
            background: #FFFFFF;
            border: 1px solid #E7EAEC;
            border-radius: 12px;
            color: #20252A;
            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.035);
            user-select: none;
            touch-action: pan-y;
        }

        .group-main {
            display: flex;
            align-items: center;
            gap: 9px;
            flex: 1;
            min-width: 0;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .group-icon {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #E8F4F3;
            font-size: 16px;
        }

        .group-info {
            flex: 1;
            min-width: 0;
        }

        .name {
            font-size: 15px;
            font-weight: 750;
            line-height: 1.1;
            margin-bottom: 1px;
        }

        .description {
            font-size: 12px;
            color: #7A838B;
            line-height: 1.15;
        }

        .arrow {
            font-size: 19px;
            color: #A1A8AD;
            line-height: 1;
        }

        .group-actions {
            display: none;
            align-items: center;
            gap: 4px;
            margin-left: 5px;
        }

        .group-actions button {
            width: 28px;
            height: 28px;
            padding: 0;
            border: 1px solid #E1E5E7;
            border-radius: 7px;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
        }

        .edit-btn {
            color: #167C78;
        }

        .delete-btn {
            color: #B44A4A;
        }

        .add-button-wrapper {
            display: none;
            justify-content: center;
            margin-top: 20px;
        }

        .add {
            height: 50px;
            padding: 0 26px;
            border: none;
            border-radius: 13px;
            background: #167C78;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }

        .add:hover {
            background: #126A67;
        }

        .login-wrapper {
            text-align: center;
            margin-top: 18px;
        }

        .login-button,
        .logout-button {
            background: none;
            border: none;
            color: #7A838B;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }

        .logout-wrapper {
            display: none;
            text-align: center;
            margin-top: 8px;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(20, 25, 28, 0.48);
        }

        .modal {
            width: 100%;
            max-width: 470px;
            padding: 24px;
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.18);
        }

        .modal h2 {
            margin: 0 0 7px;
            font-size: 22px;
        }

        .modal-description {
            margin: 0 0 20px;
            font-size: 13px;
            line-height: 1.45;
            color: #7A838B;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #4F585E;
        }

        input {
            width: 100%;
            height: 46px;
            margin-bottom: 15px;
            padding: 0 13px;
            border: 1px solid #D9DEE0;
            border-radius: 11px;
            background: #FFFFFF;
            color: #20252A;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #167C78;
            box-shadow:
                0 0 0 3px rgba(22, 124, 120, 0.08);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .cancel,
        .save {
            flex: 1;
            height: 46px;
            border: none;
            border-radius: 11px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .cancel {
            background: #EEF0F1;
            color: #596168;
        }

        .save {
            background: #167C78;
            color: #FFFFFF;
        }

        .save:hover {
            background: #126A67;
        }

        .sort-controls {
            display: none;
            position: absolute;
            right: 78px;
            top: 50%;
            transform: translateY(-50%);
            gap: 5px;
            z-index: 20;
        }

        .sort-controls button {
            width: 32px;
            height: 32px;
            border: 1px solid #2f80ed;
            border-radius: 8px;
            background: white;
            color: #2f80ed;
            font-size: 18px;
            cursor: pointer;
        }

        .sort-controls button:disabled {
            opacity: 0.3;
            cursor: default;
        }

        @media (max-width: 500px) {

            .container {
                padding: 26px 14px 40px;
            }

            h1 {
                font-size: 34px;
            }

            .group {
                padding: 12px;
            }

            .group-icon {
                width: 40px;
                height: 40px;
                min-width: 40px;
            }

            .modal {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<main class="container">


    <header class="header">

        <div class="logo">
            PARAMEDIC
        </div>

        <h1>
            HUB
        </h1>

        <div class="subtitle">
            Навчання · комунікація · команди
        </div>

    </header>


    <div class="section-title">
        Навчальні групи
    </div>


    <div
        id="error"
        class="error"
    ></div>


    <div
        id="groups"
        class="groups"
    ></div>


    <div
        id="addButtonWrapper"
        class="add-button-wrapper"
    >

        <button
            class="add"
            onclick="showAddForm()"
        >
            ＋&nbsp; Додати групу
        </button>

    </div>


    <div
        id="loginWrapper"
        class="login-wrapper"
    >

        <button
            class="login-button"
            onclick="showAdminLogin()"
        >
            🔐 Увійти як адміністратор
        </button>

    </div>


    <div
        id="logoutWrapper"
        class="logout-wrapper"
    >

        <button
            class="logout-button"
            onclick="adminLogout()"
        >
            Вийти з облікового запису
        </button>

    </div>


</main>



<div
    id="overlay"
    class="overlay"
    onclick="closeOutside(event)"
>

    <div
        class="modal"
        onclick="event.stopPropagation()"
    >

        <h2 id="groupModalTitle">
            Додати групу
        </h2>

        <p class="modal-description">
            Додайте навчальну групу до PARAMEDIC HUB.
        </p>


        <label for="groupName">
            Назва групи
        </label>

        <input
            id="groupName"
            type="text"
            placeholder="Наприклад: Група 12"
        >


        <label for="groupDescription">
            Опис
        </label>

        <input
            id="groupDescription"
            type="text"
            placeholder="Перепідготовка парамедиків"
        >


        <label for="groupLink">
            Посилання на групу
        </label>

        <input
            id="groupLink"
            type="url"
          placeholder="https://t.me/... або https://invite.viber.com/..."
        >


        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeForm()"
            >
                Скасувати
            </button>

            <button
                id="saveGroupButton"
                class="save"
                onclick="saveGroup()"
            >
                Додати
            </button>

        </div>

    </div>

</div>



<div
    id="adminOverlay"
    class="overlay"
    onclick="closeAdminLogin(event)"
>

    <div
        class="modal"
        onclick="event.stopPropagation()"
    >

        <h2>
            Вхід адміністратора
        </h2>

        <p class="modal-description">
            Увійдіть, щоб керувати навчальними групами.
        </p>


        <label for="adminEmail">
            Email
        </label>

        <input
            id="adminEmail"
            type="email"
            placeholder="Ваш email"
        >


        <label for="adminPassword">
            Пароль
        </label>

        <input
            id="adminPassword"
            type="password"
            placeholder="Ваш пароль"
        >


        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeAdminLogin()"
            >
                Скасувати
            </button>

            <button
                class="save"
                onclick="adminLogin()"
            >
                Увійти
            </button>

        </div>

    </div>

</div>


<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================
   TELEGRAM
========================= */

if (
    window.Telegram &&
    window.Telegram.WebApp
) {
    window.Telegram.WebApp.ready();
}


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://ccgsbwzdnagrjttuwdwo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_x0hztESOV7ohYyqaFzks2g_7ee-N8xE";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const BRIGHT_PROCESSOR_URL =
    SUPABASE_URL +
    "/functions/v1/bright-processor";


const RESTRICTED_GROUP_NAME =
    "ДГД baby";


let editingGroupId = null;


/* =========================
   ERROR
========================= */

function showError(message) {

    const error =
        document.getElementById("error");

    error.textContent =
        message;

    error.style.display =
        "block";
}


function hideError() {

    const error =
        document.getElementById("error");

    error.textContent = "";

    error.style.display =
        "none";
}


/* =========================
   CHECK TELEGRAM MEMBERSHIP
========================= */

async function checkDgdBabyAccess() {

    if (
        !window.Telegram ||
        !window.Telegram.WebApp
    ) {
        alert(
            "Цю групу можна відкрити лише через Telegram."
        );

        return false;
    }


    const initData =
        window.Telegram.WebApp.initData;


    if (!initData) {

        alert(
            "Не вдалося отримати дані Telegram. Відкрийте PARAMEDIC HUB через Telegram."
        );

        return false;
    }


    try {

        const response =
            await fetch(
                BRIGHT_PROCESSOR_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            action:
                                "check_dgd_baby",

                            initData:
                                initData
                        })
                }
            );


        const result =
            await response.json();


        console.log(
            "DGD BABY ACCESS:",
            result
        );


        if (
            result.ok &&
            result.member
        ) {
            return true;
        }


        alert(
            "Доступ до цієї групи мають лише учасники Telegram-групи «ДГД baby»."
        );


        return false;

    } catch (error) {

        console.error(
            "MEMBERSHIP CHECK ERROR:",
            error
        );


        alert(
            "Не вдалося перевірити доступ. Спробуйте ще раз."
        );


        return false;
    }

}


/* =========================
   LOAD GROUPS
========================= */

async function loadGroups() {

    hideError();


    const container =
        document.getElementById("groups");


    container.innerHTML = "";


    const {
        data,
        error
    } = await db
        .from("group")
        .select(
            "id, name, description, telegram_link, sort_order"
        )
        .order(
            "sort_order",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "LOAD GROUPS ERROR:",
            error
        );

        showError(
            "Не вдалося завантажити групи: " +
            error.message
        );

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div
                style="
                    padding:20px;
                    text-align:center;
                    color:#7A838B;
                    background:#FFFFFF;
                    border-radius:12px;
                    border:1px solid #E7EAEC;
                "
            >
                Навчальних груп поки немає.
            </div>
        `;

        updateAdminUI();

        return;
    }


    data.forEach(
        function(group) {

            const card =
                document.createElement("div");


            card.className =
                "group";


            card.dataset.id =
                group.id;


            const main =
                document.createElement("a");


            main.className =
                "group-main";


            main.href =
                group.telegram_link;


            main.target =
                "_blank";


            main.rel =
                "noopener noreferrer";


            main.innerHTML = `

                <div class="group-icon">
                    👥
                </div>

                <div class="group-info">

                    <div class="name">
                        ${escapeHTML(group.name)}
                    </div>

                    <div class="description">
                        ${escapeHTML(
                            group.description ||
                            "Навчальна група"
                        )}
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            `;


            /*
             * ДГД baby — перевіряємо членство
             */
            if (
                group.name.trim() ===
                RESTRICTED_GROUP_NAME
            ) {

                main.addEventListener(
                    "click",
                    async function(event) {

                        event.preventDefault();

                        event.stopPropagation();


                        const hasAccess =
                            await checkDgdBabyAccess();


                        if (hasAccess) {

                            window.open(
                                group.telegram_link,
                                "_blank"
                            );

                        }

                    }
                );

            }


            const actions =
                document.createElement("div");


            actions.className =
                "group-actions";


            actions.innerHTML = `

                <button
                    class="edit-btn"
                    title="Редагувати"
                >
                    ✎
                </button>

                <button
                    class="delete-btn"
                    title="Видалити"
                >
                    ×
                </button>

            `;


            actions
                .querySelector(".edit-btn")
                .addEventListener(
                    "click",
                    function(event) {

                        editGroup(
                            group.id,
                            event
                        );

                    }
                );


            actions
                .querySelector(".delete-btn")
                .addEventListener(
                    "click",
                    function(event) {

                        deleteGroup(
                            group.id,
                            event
                        );

                    }
                );


            card.appendChild(main);

            card.appendChild(actions);

            container.appendChild(card);

        }
    );


    updateAdminUI();

    enableDragAndDrop();

}


/* =========================
   SORT GROUPS
========================= */

function enableDragAndDrop() {

    const container =
        document.getElementById("groups");


    const cards =
        [
            ...container.querySelectorAll(".group")
        ];


    if (
        document.body.dataset.admin !== "true"
    ) {
        return;
    }


    cards.forEach(
        function(card, index) {

            if (
                card.querySelector(
                    ".sort-controls"
                )
            ) {
                return;
            }


            const controls =
                document.createElement("div");


            controls.className =
                "sort-controls";


            controls.innerHTML = `

                <button
                    type="button"
                    class="sort-up"
                    ${index === 0 ? "disabled" : ""}
                >
                    ↑
                </button>

                <button
                    type="button"
                    class="sort-down"
                    ${index === cards.length - 1 ? "disabled" : ""}
                >
                    ↓
                </button>

            `;


            card.appendChild(controls);


            controls
                .querySelector(".sort-up")
                .addEventListener(
                    "click",
                    async function(event) {

                        event.preventDefault();

                        event.stopPropagation();


                        const previous =
                            card.previousElementSibling;


                        if (!previous) {
                            return;
                        }


                        container.insertBefore(
                            card,
                            previous
                        );


                        await saveGroupOrder();


                        location.reload();

                    }
                );


            controls
                .querySelector(".sort-down")
                .addEventListener(
                    "click",
                    async function(event) {

                        event.preventDefault();

                        event.stopPropagation();


                        const next =
                            card.nextElementSibling;


                        if (!next) {
                            return;
                        }


                        container.insertBefore(
                            next,
                            card
                        );


                        await saveGroupOrder();


                        location.reload();

                    }
                );

        }
    );

}


/* =========================
   SAVE ORDER
========================= */

async function saveGroupOrder() {

    const cards =
        [
            ...document.querySelectorAll(
                "#groups .group"
            )
        ];


    for (
        let i = 0;
        i < cards.length;
        i++
    ) {

        const id =
            cards[i].dataset.id;


        const {
            error
        } = await db
            .from("group")
            .update({
                sort_order: i + 1
            })
            .eq(
                "id",
                id
            );


        if (error) {

            console.error(
                "SAVE ORDER ERROR:",
                error
            );


            showError(
                "Не вдалося зберегти порядок груп: " +
                error.message
            );


            await loadGroups();

            return;
        }

    }

}


/* =========================
   ADD FORM
========================= */

function showAddForm() {

    editingGroupId = null;


    document.getElementById(
        "groupModalTitle"
    ).textContent =
        "Додати групу";


    document.getElementById(
        "saveGroupButton"
    ).textContent =
        "Додати";


    document.getElementById(
        "groupName"
    ).value = "";


    document.getElementById(
        "groupDescription"
    ).value = "";


    document.getElementById(
        "groupLink"
    ).value = "";


    document.getElementById(
        "overlay"
    ).style.display =
        "flex";


    document.getElementById(
        "groupName"
    ).focus();

}


/* =========================
   CLOSE FORM
========================= */

function closeForm() {

    document.getElementById(
        "overlay"
    ).style.display =
        "none";


    editingGroupId = null;

}


/* =========================
   OUTSIDE CLICK
========================= */

function closeOutside(event) {

    if (
        event.target ===
        document.getElementById("overlay")
    ) {

        closeForm();

    }

}


/* =========================
   SAVE GROUP
========================= */

async function saveGroup() {

    const name =
        document.getElementById(
            "groupName"
        ).value.trim();


    const description =
        document.getElementById(
            "groupDescription"
        ).value.trim();


    const link =
        document.getElementById(
            "groupLink"
        ).value.trim();


    if (!name) {

        alert(
            "Вкажіть назву групи."
        );

        return;
    }


    if (!link) {

        alert(
            "Вкажіть посилання на Telegram-групу."
        );

        return;
    }


if (
    !link.startsWith("https://t.me/") &&
    !link.startsWith("https://invite.viber.com/")
) {

    alert(
        "Вкажіть коректне посилання на Telegram або Viber-групу."
    );

    return;
}


    let error;


    if (editingGroupId) {

        const result =
            await db
                .from("group")
                .update({

                    name: name,

                    description:
                        description ||
                        "Навчальна група",

                    telegram_link:
                        link

                })
                .eq(
                    "id",
                    editingGroupId
                );


        error =
            result.error;

    } else {

        const {
            data: lastGroup,
            error: lastGroupError
        } = await db
            .from("group")
            .select(
                "sort_order"
            )
            .order(
                "sort_order",
                {
                    ascending: false
                }
            )
            .limit(1);


        if (lastGroupError) {

            alert(
                "Не вдалося визначити порядок груп: " +
                lastGroupError.message
            );

            return;
        }


        const nextOrder =
            lastGroup &&
            lastGroup.length
                ? Number(
                    lastGroup[0].sort_order
                ) + 1
                : 1;


        const result =
            await db
                .from("group")
                .insert({

                    name: name,

                    description:
                        description ||
                        "Навчальна група",

                    telegram_link:
                        link,

                    sort_order:
                        nextOrder

                });


        error =
            result.error;

    }


    if (error) {

        console.error(
            "SAVE GROUP ERROR:",
            error
        );


        alert(
            "Помилка: " +
            error.message
        );

        return;
    }


    closeForm();

    await loadGroups();

}


/* =========================
   EDIT GROUP
========================= */

async function editGroup(
    id,
    event
) {

    event.preventDefault();

    event.stopPropagation();


    const {
        data,
        error
    } = await db
        .from("group")
        .select(
            "id, name, description, telegram_link"
        )
        .eq(
            "id",
            id
        )
        .single();


    if (error) {

        alert(
            "Помилка: " +
            error.message
        );

        return;
    }


    editingGroupId =
        id;


    document.getElementById(
        "groupModalTitle"
    ).textContent =
        "Редагувати групу";


    document.getElementById(
        "saveGroupButton"
    ).textContent =
        "Зберегти";


    document.getElementById(
        "groupName"
    ).value =
        data.name;


    document.getElementById(
        "groupDescription"
    ).value =
        data.description || "";


    document.getElementById(
        "groupLink"
    ).value =
        data.telegram_link;


    document.getElementById(
        "overlay"
    ).style.display =
        "flex";

}


/* =========================
   DELETE GROUP
========================= */

async function deleteGroup(
    id,
    event
) {

    event.preventDefault();

    event.stopPropagation();


    if (
        !confirm(
            "Видалити цю групу з PARAMEDIC HUB?"
        )
    ) {
        return;
    }


    const {
        error
    } = await db
        .from("group")
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "Помилка: " +
            error.message
        );

        return;
    }


    await loadGroups();

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================
   ADMIN LOGIN
========================= */

async function adminLogin() {

    const email =
        document.getElementById(
            "adminEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "adminPassword"
        ).value;


    if (
        !email ||
        !password
    ) {

        alert(
            "Введіть email і пароль."
        );

        return;
    }


    const {
        error
    } =
        await db.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        alert(
            "Неправильний email або пароль."
        );

        return;
    }


    closeAdminLogin();

    await updateAdminUI();

    await loadGroups();

}


/* =========================
   SHOW LOGIN
========================= */

function showAdminLogin() {

    document.getElementById(
        "adminOverlay"
    ).style.display =
        "flex";


    document.getElementById(
        "adminEmail"
    ).focus();

}


/* =========================
   CLOSE LOGIN
========================= */

function closeAdminLogin(event) {

    if (
        event &&
        event.target !==
        document.getElementById(
            "adminOverlay"
        )
    ) {

        return;
    }


    document.getElementById(
        "adminOverlay"
    ).style.display =
        "none";


    document.getElementById(
        "adminEmail"
    ).value = "";


    document.getElementById(
        "adminPassword"
    ).value = "";

}


/* =========================
   LOGOUT
========================= */

async function adminLogout() {

    await db.auth.signOut();

    await updateAdminUI();

    await loadGroups();

}


/* =========================
   ADMIN UI
========================= */

async function updateAdminUI() {

    const {
        data
    } =
        await db.auth.getSession();


    const isAdmin =
        !!data.session;


    document.body.dataset.admin =
        isAdmin
            ? "true"
            : "false";


    document.getElementById(
        "addButtonWrapper"
    ).style.display =
        isAdmin
            ? "flex"
            : "none";


    document.getElementById(
        "loginWrapper"
    ).style.display =
        isAdmin
            ? "none"
            : "block";


    document.getElementById(
        "logoutWrapper"
    ).style.display =
        isAdmin
            ? "block"
            : "none";


    document
        .querySelectorAll(
            ".group-actions"
        )
        .forEach(
            function(element) {

                element.style.display =
                    isAdmin
                        ? "flex"
                        : "none";

            }
        );


    document
        .querySelectorAll(
            ".sort-controls"
        )
        .forEach(
            function(element) {

                element.style.display =
                    isAdmin
                        ? "flex"
                        : "none";

            }
        );

}


/* =========================
   AUTH
========================= */

db.auth.onAuthStateChange(
    function() {

        updateAdminUI();

    }
);


/* =========================
   START
========================= */

(async function() {

    await updateAdminUI();

    await loadGroups();

})();

</script>
