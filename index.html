<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PARAMEDIC HUB</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #F5F6F7;

            color: #20252A;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width: 760px;

            margin: 0 auto;

            padding:
                32px
                18px
                50px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            margin-bottom: 32px;
        }


        .logo {

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 2.5px;

            color: #167C78;

            margin-bottom: 4px;
        }


        h1 {

            margin: 0;

            font-size: 38px;

            line-height: 1;

            font-weight: 800;

            letter-spacing: -1.5px;
        }


        .subtitle {

            margin-top: 10px;

            font-size: 14px;

            color: #7A838B;
        }


        /* =========================
           SECTION
        ========================= */

        .section-title {

            margin-bottom: 12px;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 1px;

            text-transform: uppercase;

            color: #7A838B;
        }


        /* =========================
           GROUP LIST
        ========================= */

        .groups {

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        /* =========================
           GROUP CARD
        ========================= */

        .group {

            display: flex;

            align-items: center;

            gap: 14px;

            width: 100%;

            padding: 16px;

            background: #FFFFFF;

            border: 1px solid #E7EAEC;

            border-radius: 16px;

            text-decoration: none;

            color: #20252A;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.035);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                border-color 0.15s ease;
        }


        .group:hover {

            transform: translateY(-1px);

            border-color: #D5DDDE;

            box-shadow:
                0 6px 16px
                rgba(0, 0, 0, 0.07);
        }


        /* =========================
           GROUP ICON
        ========================= */

        .group-icon {

            width: 46px;

            height: 46px;

            min-width: 46px;

            border-radius: 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #E8F4F3;

            font-size: 21px;
        }


        /* =========================
           GROUP TEXT
        ========================= */

        .group-info {

            flex: 1;

            min-width: 0;
        }


        .name {

            font-size: 16px;

            font-weight: 750;

            margin-bottom: 4px;
        }


        .description {

            font-size: 13px;

            color: #7A838B;

            line-height: 1.35;
        }


        /* =========================
           ARROW
        ========================= */

        .arrow {

            font-size: 24px;

            color: #A1A8AD;

            line-height: 1;
        }


        /* =========================
           ADD BUTTON
        ========================= */

        .add-button-wrapper {

            display: flex;

            justify-content: center;

            margin-top: 20px;
        }


        .add {

            height: 50px;

            padding:
                0 26px;

            border: none;

            border-radius: 13px;

            background: #167C78;

            color: #FFFFFF;

            font-size: 15px;

            font-weight: 700;

            font-family: inherit;

            cursor: pointer;

            box-shadow:
                0 4px 12px
                rgba(22, 124, 120, 0.20);

            transition:
                background 0.15s ease,
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }


        .add:hover {

            background: #126A67;

            transform: translateY(-1px);

            box-shadow:
                0 6px 16px
                rgba(22, 124, 120, 0.24);
        }


        .add:active {

            transform: translateY(0);
        }


        /* =========================
           MODAL BACKGROUND
        ========================= */

        .overlay {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 100;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(20, 25, 28, 0.48);
        }


        /* =========================
           MODAL
        ========================= */

        .modal {

            width: 100%;

            max-width: 470px;

            padding: 24px;

            background: #FFFFFF;

            border-radius: 20px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.18);
        }


        .modal h2 {

            margin: 0 0 7px;

            font-size: 22px;

            line-height: 1.2;
        }


        .modal-description {

            margin:
                0
                0
                20px;

            font-size: 13px;

            line-height: 1.45;

            color: #7A838B;
        }


        /* =========================
           FORM
        ========================= */

        label {

            display: block;

            margin-bottom: 6px;

            font-size: 13px;

            font-weight: 700;

            color: #4F585E;
        }


        input {

            width: 100%;

            height: 46px;

            margin-bottom: 15px;

            padding:
                0
                13px;

            border:
                1px solid
                #D9DEE0;

            border-radius: 11px;

            background: #FFFFFF;

            color: #20252A;

            font-family: inherit;

            font-size: 14px;

            outline: none;
        }


        input:focus {

            border-color: #167C78;

            box-shadow:
                0 0 0 3px
                rgba(22, 124, 120, 0.08);
        }


        /* =========================
           MODAL BUTTONS
        ========================= */

        .modal-buttons {

            display: flex;

            gap: 10px;

            margin-top: 5px;
        }


        .cancel,
        .save {

            flex: 1;

            height: 46px;

            border: none;

            border-radius: 11px;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;
        }


        .cancel {

            background: #EEF0F1;

            color: #596168;
        }


        .save {

            background: #167C78;

            color: #FFFFFF;
        }


        .save:hover {

            background: #126A67;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .container {

                padding:
                    26px
                    14px
                    40px;
            }


            h1 {

                font-size: 34px;
            }


            .group {

                padding: 15px;
            }


            .group-icon {

                width: 44px;

                height: 44px;

                min-width: 44px;
            }


            .modal {

                padding: 20px;
            }


            .add {

                width: auto;

                min-width: 190px;
            }

        }

    </style>

</head>


<body>


    <main class="container">


        <!-- HEADER -->

        <header class="header">

            <div class="logo">
                PARAMEDIC
            </div>

            <h1>
                HUB
            </h1>

            <div class="subtitle">
                Навчання · комунікація · команди
            </div>

        </header>



        <!-- GROUPS -->

        <div class="section-title">
            Навчальні групи
        </div>


        <div
            class="groups"
            id="groups"
        >


            <!-- GROUP 11 -->

            <a
                class="group"
                href="https://t.me/+Zty8coe38iVjZDky"
                  target="_blank"
                rel="noopener noreferrer"
            >

                <div class="group-icon">
                    👥
                </div>


                <div class="group-info">

                    <div class="name">
                        Група 11
                    </div>

                    <div class="description">
                        Перепідготовка парамедиків
                    </div>

                </div>


                <div class="arrow">
                    ›
                </div>

            </a>


        </div>



        <!-- ADD GROUP BUTTON -->

        <div class="add-button-wrapper">

            <button
                class="add"
                onclick="showAddForm()"
            >

                ＋&nbsp; Додати групу

            </button>

        </div>


    </main>



    <!-- =========================
         ADD GROUP MODAL
    ========================= -->

    <div
        class="overlay"
        id="overlay"
        onclick="closeOutside(event)"
    >


        <div
            class="modal"
            onclick="event.stopPropagation()"
        >


            <h2>
                Додати групу
            </h2>


            <p class="modal-description">
                Додайте навчальну групу до PARAMEDIC HUB.
            </p>



            <!-- NAME -->

            <label for="groupName">
                Назва групи
            </label>

            <input
                id="groupName"
                type="text"
                placeholder="Наприклад: Група 12"
            >



            <!-- DESCRIPTION -->

            <label for="groupDescription">
                Опис
            </label>

            <input
                id="groupDescription"
                type="text"
                placeholder="Перепідготовка парамедиків"
            >



            <!-- TELEGRAM LINK -->

            <label for="groupLink">
                Посилання на Telegram-групу
            </label>

            <input
                id="groupLink"
                type="url"
                placeholder="https://t.me/..."
            >



            <!-- BUTTONS -->

            <div class="modal-buttons">


                <button
                    class="cancel"
                    onclick="closeForm()"
                >
                    Скасувати
                </button>


                <button
                    class="save"
                    onclick="addGroup()"
                >
                    Додати
                </button>


            </div>


        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /* OPEN MODAL */

        function showAddForm() {

            document
                .getElementById("overlay")
                .style.display = "flex";


            document
                .getElementById("groupName")
                .focus();

        }



        /* CLOSE MODAL */

        function closeForm() {

            document
                .getElementById("overlay")
                .style.display = "none";


            document
                .getElementById("groupName")
                .value = "";


            document
                .getElementById("groupDescription")
                .value = "";


            document
                .getElementById("groupLink")
                .value = "";

        }



        /* CLOSE BY CLICKING OUTSIDE */

        function closeOutside(event) {

            if (
                event.target ===
                document.getElementById("overlay")
            ) {

                closeForm();

            }

        }



        /* ADD NEW GROUP */

        function addGroup() {


            const name =
                document
                .getElementById("groupName")
                .value
                .trim();


            const description =
                document
                .getElementById("groupDescription")
                .value
                .trim();


            const link =
                document
                .getElementById("groupLink")
                .value
                .trim();



            /* CHECK NAME */

            if (!name) {

                alert(
                    "Вкажіть назву групи."
                );

                return;

            }



            /* CHECK LINK */

            if (!link) {

                alert(
                    "Вкажіть посилання на Telegram-групу."
                );

                return;

            }



            /* CHECK TELEGRAM LINK */

            if (
                !link.startsWith(
                    "https://t.me/"
                )
            ) {

                alert(
                    "Посилання має починатися з https://t.me/"
                );

                return;

            }



            /* CREATE GROUP */

            const group =
                document.createElement("a");


            group.className = "group";


            group.href = link;


            group.target = "_blank";


            group.rel =
                "noopener noreferrer";



            group.innerHTML = `

                <div class="group-icon">
                    👥
                </div>


                <div class="group-info">

                    <div class="name">
                        ${escapeHTML(name)}
                    </div>

                    <div class="description">
                        ${
                            escapeHTML(
                                description ||
                                "Навчальна група"
                            )
                        }
                    </div>

                </div>


                <div class="arrow">
                    ›
                </div>

            `;



            /* ADD TO LIST */

            document
                .getElementById("groups")
                .appendChild(group);



            /* CLOSE */

            closeForm();

        }



        /* PROTECT HTML */

        function escapeHTML(text) {

            const div =
                document.createElement("div");


            div.textContent = text;


            return div.innerHTML;

        }


    </script>


</body>

</html>
