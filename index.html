<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PARAMEDIC HUB</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #F5F6F7;

            color: #20252A;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width: 760px;

            margin: 0 auto;

            padding:
                32px
                18px
                50px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            margin-bottom: 32px;
        }


        .logo {

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 2.5px;

            color: #167C78;

            margin-bottom: 4px;
        }


        h1 {

            margin: 0;

            font-size: 38px;

            line-height: 1;

            font-weight: 800;

            letter-spacing: -1.5px;
        }


        .subtitle {

            margin-top: 10px;

            font-size: 14px;

            color: #7A838B;
        }


        /* =========================
           SECTION
        ========================= */

        .section-title {

            margin-bottom: 12px;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 1px;

            text-transform: uppercase;

            color: #7A838B;
        }


        /* =========================
           GROUP LIST
        ========================= */

      .groups {
    display: flex;
    flex-direction: column;
    gap: 8px;
}


/* GROUP CARD */

.group {
    display: flex;
    align-items: center;

    width: 100%;

    padding: 6px 10px;

    background: #FFFFFF;

    border: 1px solid #E7EAEC;
    border-radius: 12px;

    color: #20252A;

    box-shadow:
        0 2px 6px
        rgba(0, 0, 0, 0.035);
}


/* GROUP MAIN */

.group-main {
    display: flex;
    align-items: center;

    gap: 9px;

    flex: 1;
    min-width: 0;

    text-decoration: none;
    color: inherit;
}


/* ICON */

.group-icon {
    width: 32px;
    height: 32px;
    min-width: 32px;

    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #E8F4F3;

    font-size: 16px;
}


/* TEXT */

.group-info {
    flex: 1;
    min-width: 0;
}

.name {
    font-size: 15px;
    font-weight: 750;

    line-height: 1.1;

    margin-bottom: 1px;
}

.description {
    font-size: 12px;

    color: #7A838B;

    line-height: 1.15;
}


/* ARROW */

.arrow {
    font-size: 19px;

    color: #A1A8AD;

    line-height: 1;
}


/* ADMIN ACTIONS */

.group-actions {
    display: flex;

    align-items: center;

    gap: 4px;

    margin-left: 5px;
}

.group-actions button {
    width: 28px;
    height: 28px;

    padding: 0;

    border: 1px solid #E1E5E7;

    border-radius: 7px;

    background: #FFFFFF;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.group-actions button:hover {
    background: #F3F5F6;
}

.edit-btn {
    color: #167C78;
}

.delete-btn {
    color: #B44A4A;
}

        /* =========================
           ADD BUTTON
        ========================= */

        .add-button-wrapper {

            display: flex;

            justify-content: center;

            margin-top: 20px;
        }


        .add {

            height: 50px;

            padding:
                0 26px;

            border: none;

            border-radius: 13px;

            background: #167C78;

            color: #FFFFFF;

            font-size: 15px;

            font-weight: 700;

            font-family: inherit;

            cursor: pointer;

            box-shadow:
                0 4px 12px
                rgba(22, 124, 120, 0.20);

            transition:
                background 0.15s ease,
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }


        .add:hover {

            background: #126A67;

            transform: translateY(-1px);

            box-shadow:
                0 6px 16px
                rgba(22, 124, 120, 0.24);
        }


        .add:active {

            transform: translateY(0);
        }


        /* =========================
           MODAL BACKGROUND
        ========================= */

        .overlay {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 100;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(20, 25, 28, 0.48);
        }


        /* =========================
           MODAL
        ========================= */

        .modal {

            width: 100%;

            max-width: 470px;

            padding: 24px;

            background: #FFFFFF;

            border-radius: 20px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.18);
        }


        .modal h2 {

            margin: 0 0 7px;

            font-size: 22px;

            line-height: 1.2;
        }


        .modal-description {

            margin:
                0
                0
                20px;

            font-size: 13px;

            line-height: 1.45;

            color: #7A838B;
        }


        /* =========================
           FORM
        ========================= */

        label {

            display: block;

            margin-bottom: 6px;

            font-size: 13px;

            font-weight: 700;

            color: #4F585E;
        }


        input {

            width: 100%;

            height: 46px;

            margin-bottom: 15px;

            padding:
                0
                13px;

            border:
                1px solid
                #D9DEE0;

            border-radius: 11px;

            background: #FFFFFF;

            color: #20252A;

            font-family: inherit;

            font-size: 14px;

            outline: none;
        }


        input:focus {

            border-color: #167C78;

            box-shadow:
                0 0 0 3px
                rgba(22, 124, 120, 0.08);
        }


        /* =========================
           MODAL BUTTONS
        ========================= */

        .modal-buttons {

            display: flex;

            gap: 10px;

            margin-top: 5px;
        }


        .cancel,
        .save {

            flex: 1;

            height: 46px;

            border: none;

            border-radius: 11px;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;
        }


        .cancel {

            background: #EEF0F1;

            color: #596168;
        }


        .save {

            background: #167C78;

            color: #FFFFFF;
        }


        .save:hover {

            background: #126A67;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .container {

                padding:
                    26px
                    14px
                    40px;
            }


            h1 {

                font-size: 34px;
            }


            .group {

                padding: 15px;
            }


            .group-icon {

                width: 44px;

                height: 44px;

                min-width: 44px;
            }


            .modal {

                padding: 20px;
            }


            .add {

                width: auto;

                min-width: 190px;
            }

        }

    </style>

</head>


<body>

            <div class="subtitle">

        </header>



        <!-- GROUPS -->

        <div class="section-title">

        </div>


        <div

        >


            <!-- GROUP 11 -->

            <a

    </main>



    <!-- =========================

    ========================= -->

    <div
        class="overlay"
        id="overlay"
        onclick="closeOutside(event)"
    >


        <div
            class="modal"
            onclick="event.stopPropagation()"
        >


            <h2>
                Додати групу
            </h2>


            <p class="modal-description">
                Додайте навчальну групу до PARAMEDIC HUB.
            </p>



            <!-- NAME -->

            <label for="groupName">
                Назва групи
            </label>

            <input
                id="groupName"
                type="text"

            >



            <!-- DESCRIPTION -->

            <label for="groupDescription">
                Опис
            </label>

            <input
                id="groupDescription"

            <!-- TELEGRAM LINK -->

            <label for="groupLink">

            <!-- BUTTONS -->

            <div class="modal-buttons">


                <button

                    Скасувати

                <button class="save" id="saveGroupButton" onclick="saveGroup()">Додати</button>


            </div>


        </div>

    </div>
<!-- ADMIN LOGIN MODAL -->

<div

>

    <div

    </div>

    <!-- =========================

    <script> const SUPABASE_URL = "https://ccgsbwzdnagrjttuwdwo.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_x0hztESOV7ohYyqaFzks2g_7ee-N8xE";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


        /* OPEN MODAL */
async function loadGroups() {
  const { data, error } = await db
    .from("group")
    .select("id, name, description, telegram_link")
    .order("created_at", { ascending: true });

  if (error) {
    console.error(error);
    return;
  }

  const groups = document.getElementById("groups");
  groups.innerHTML = "";

  data.forEach(group => {
    groups.innerHTML += `
      <div class="group">
  <a
    href="${group.telegram_link}"
    target="_blank"
    rel="noopener noreferrer"
    class="group-main"
  >
    <div class="group-icon">👥</div>

    <div class="group-info">
      <div class="name">${escapeHTML(group.name)}</div>
      <div class="description">${escapeHTML(group.description)}</div>
    </div>

    <div class="arrow">›</div>
  </a>

  <div class="group-actions">
    <button
      class="edit-btn"
      onclick="editGroup('${group.id}', event)"
    >
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 20h9"/>
  <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
</svg>
    </button>

    <button
      class="delete-btn"
      onclick="deleteGroup('${group.id}', event)"
    >
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 6h18"/>
  <path d="M8 6V4h8v2"/>
  <path d="M19 6l-1 14H6L5 6"/>
  <path d="M10 11v5"/>
  <path d="M14 11v5"/>
</svg>
    </button>
  </div>
</div>
    `;
  });
}

loadGroups();
        function showAddForm() {

            document
                .getElementById("overlay")
                .style.display = "flex";


            document
                .getElementById("groupName")
                .focus();

        }



        /* CLOSE MODAL */

        function closeForm() {

            document
                .getElementById("overlay")
                .style.display = "none";


            document
                .getElementById("groupName")
                .value = "";


            document
                .getElementById("groupDescription")
                .value = "";


            document
                .getElementById("groupLink")
                .value = "";

        }



        /* CLOSE BY CLICKING OUTSIDE */

        function closeOutside(event) {

            if (
                event.target ===
                document.getElementById("overlay")
            ) {

                closeForm();

            }

        }



        /* ADD NEW GROUP */

async function addGroup() {

    const name =
        document
        .getElementById("groupName")
        .value
        .trim();

    const description =
        document
        .getElementById("groupDescription")
        .value
        .trim();

    const link =
        document
        .getElementById("groupLink")
        .value
        .trim();


    /* CHECK NAME */

    if (!name) {
        alert("Вкажіть назву групи.");
        return;
    }


    /* CHECK LINK */

    if (!link) {
        alert("Вкажіть посилання на Telegram-групу.");
        return;
    }


    /* CHECK TELEGRAM LINK */

    if (!link.startsWith("https://t.me/")) {
        alert(
            "Посилання має починатися з https://t.me/"
        );
        return;
    }


    /* SAVE TO SUPABASE */

    const { error } = await db
        .from("group")
        .insert({
            name: name,
            description: description || "Навчальна група",
            telegram_link: link
        });


    if (error) {
    console.error(error);
    alert("Помилка: " + error.message);
    return;
}


    /* RELOAD GROUPS */

    await loadGroups();


    /* CLOSE */

    closeForm();
}

    


        /* PROTECT HTML */
async function deleteGroup(id, event) {
    event.preventDefault();
    event.stopPropagation();

    if (!confirm("Видалити цю групу з PARAMEDIC HUB?")) {
        return;
    }

    const { error } = await db
        .from("group")
        .delete()
        .eq("id", id);

    if (error) {
        console.error(error);
        alert("Помилка: " + error.message);
        return;
    }

    await loadGroups();
}


async function editGroup(id, event) {
    editingGroupId = id;
    event.preventDefault();
    event.stopPropagation();

    const { data, error } = await db
        .from("group")
        .select("id, name, description, telegram_link")
        .eq("id", id)
        .single();

    if (error) {
        console.error(error);
        alert("Помилка: " + error.message);
        return;
    }

    document.getElementById("groupName").value = data.name;
    document.getElementById("groupDescription").value = data.description;
    document.getElementById("groupLink").value = data.telegram_link;

    document.getElementById("overlay").style.display = "flex";
}
        let editingGroupId = null;
const ADMIN_IDS = [
    // сюди потім вставимо твій Telegram ID
];
async function saveGroup() {

    const name = document.getElementById("groupName").value.trim();
    const description = document.getElementById("groupDescription").value.trim();
    const link = document.getElementById("groupLink").value.trim();

    if (!name) {
        alert("Вкажіть назву групи.");
        return;
    }

    if (!link) {
        alert("Вкажіть посилання на Telegram-групу.");
        return;
    }

    if (!link.startsWith("https://t.me/")) {
        alert("Посилання має починатися з https://t.me/");
        return;
    }

    let error;

    if (editingGroupId) {

        const result = await db
            .from("group")
            .update({
                name: name,
                description: description || "Навчальна група",
                telegram_link: link
            })
            .eq("id", editingGroupId);

        error = result.error;

    } else {

        const result = await db
            .from("group")
            .insert({
                name: name,
                description: description || "Навчальна група",
                telegram_link: link
            });

        error = result.error;
    }

    if (error) {
        console.error(error);
        alert("Помилка: " + error.message);
        return;
    }

    editingGroupId = null;

    await loadGroups();
    closeForm();
}
        function escapeHTML(text) {

            const div =
                document.createElement("div");


            div.textContent = text;


            return div.innerHTML;

        }
function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// ===== ADMIN LOGIN =====

async function adminLogin() {

    const email = document.getElementById("adminEmail").value.trim();
    const password = document.getElementById("adminPassword").value;

    if (!email || !password) {
        alert("Введіть email і пароль.");
        return;
    }

    const { error } = await db.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        alert("Неправильний email або пароль.");
        return;
    }

    closeAdminLogin();
    updateAdminUI();
    await loadGroups();
}


function showAdminLogin() {

    document.getElementById("adminOverlay").style.display = "flex";

    document.getElementById("adminEmail").focus();
}


function closeAdminLogin(event) {

    if (
        event &&
        event.target !== document.getElementById("adminOverlay")
    ) {
        return;
    }

    document.getElementById("adminOverlay").style.display = "none";

    document.getElementById("adminEmail").value = "";
    document.getElementById("adminPassword").value = "";
}


async function updateAdminUI() {

    const { data } = await db.auth.getSession();

    const isAdmin = !!data.session;

    const addButton = document.querySelector(".add-button-wrapper");
    const groupActions = document.querySelectorAll(".group-actions");
    const loginButton = document.querySelector(
        'button[onclick="showAdminLogin()"]'
    );

    if (addButton) {
        addButton.style.display = isAdmin ? "block" : "none";
    }

    groupActions.forEach(function (element) {
        element.style.display = isAdmin ? "flex" : "none";
    });

    if (loginButton) {
        loginButton.style.display = isAdmin ? "none" : "inline-block";
    }
}


db.auth.onAuthStateChange(function () {
    updateAdminUI();
});

updateAdminUI();

    </script>
